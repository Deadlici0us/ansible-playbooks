- name: Setup and Configure Grafana Cloud Monitoring
  hosts: vps
  become: yes
  vars_files:
    - vars/secrets.yml

  tasks:
    - name: 1. Install Grafana GPG Key
      get_url:
        url: https://apt.grafana.com/gpg.key
        dest: /etc/apt/keyrings/grafana.asc
        mode: '0644'

    - name: 2. Add Grafana Repository
      copy:
        dest: /etc/apt/sources.list.d/grafana.list
        content: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main\n"
        mode: '0644'

    - name: 3. Install Grafana Alloy
      apt:
        name: alloy
        state: present
        update_cache: yes

    - name: 4. Deploy Alloy Configuration
      template:
        src: templates/config.alloy.j2
        dest: /etc/alloy/config.alloy
        owner: root  # Changed from alloy since the service will run as root
        group: root
        mode: '0640'
      notify: Restart Alloy

    - name: 5. Create systemd override directory for Alloy
      file:
        path: /etc/systemd/system/alloy.service.d
        state: directory
        mode: '0755'

    - name: 6. Configure Alloy service to run as root for cAdvisor
      copy:
        dest: /etc/systemd/system/alloy.service.d/override.conf
        content: |
          [Service]
          User=root
          Group=root
        mode: '0644'
      notify: 
        - Reload systemd
        - Restart Alloy

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Restart Alloy
      service:
        name: alloy
        state: restarted
        enabled: yes
