---
- name: Main VPS Configuration
  hosts: vps
  remote_user: "{{ deploy_user }}"
  become: true
  vars_files:
    - vars/secrets.yml

  tasks:
    - name: Pre-flight - Check OS and Version
      ansible.builtin.fail:
        msg: "This server is running {{ ansible_distribution }} {{ ansible_distribution_version }}. Only Ubuntu 22.04 or higher is supported."
      when: >
        ansible_distribution != 'Ubuntu' or 
        ansible_distribution_version is version('22.04', '<')

    - name: 0. System - Set System Timezone
      community.general.timezone:
        name: "{{ time_zone }}"

    - name: 0. System - Write /etc/timezone
      ansible.builtin.copy:
        content: "{{ time_zone }}\n"
        dest: /etc/timezone	

    - name: 2. Optimization - Ensure 2GB Swap is Active
      block:
        - name: Check if swap file exists
          ansible.builtin.stat:
            path: /swapfile
          register: swap_exists

        - name: Create and Enable Swap if missing
          block:
            - name: Allocate space for swap (2GB)
              ansible.builtin.command: fallocate -l 2G /swapfile
            - name: Set strict permissions
              ansible.builtin.file:
                path: /swapfile
                mode: '0600'
                owner: root
                group: root
            - name: Format as swap
              ansible.builtin.command: mkswap /swapfile
            - name: Activate swap immediately
              ansible.builtin.command: swapon /swapfile
          when: not swap_exists.stat.exists

        - name: Ensure swap is permanent in /etc/fstab
          ansible.builtin.mount:
            name: none
            src: /swapfile
            fstype: swap
            opts: sw
            passno: '0'
            dump: '0'
            state: present

        - name: Optimize Swappiness (Minimize disk thrashing)
          ansible.builtin.sysctl:
            name: vm.swappiness
            value: '10'
            state: present
            reload: yes

    - name: 3. Advanced SSH Hardening
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^Port', line: 'Port 65500' }
        - { regexp: '^Protocol', line: 'Protocol 2' }
        - { regexp: '^PermitRootLogin', line: 'PermitRootLogin no' }
        - { regexp: '^PasswordAuthentication', line: 'PasswordAuthentication no' }
        - { regexp: '^PubkeyAuthentication', line: 'PubkeyAuthentication yes' }
        - { regexp: '^PermitEmptyPasswords', line: 'PermitEmptyPasswords no' }
        - { regexp: '^MaxAuthTries', line: 'MaxAuthTries 3' }
        - { regexp: '^LogLevel', line: 'LogLevel VERBOSE' }
        - { regexp: '^IgnoreRhosts', line: 'IgnoreRhosts yes' }
        - { regexp: '^ClientAliveInterval', line: 'ClientAliveInterval 300' }
        - { regexp: '^ClientAliveCountMax', line: 'ClientAliveCountMax 0' }
        - { regexp: '^X11Forwarding', line: 'X11Forwarding no' }
        - { regexp: '^HostKeyAlgorithms', line: 'HostKeyAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com' }
        - { regexp: '^KexAlgorithms', line: 'KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org' }
      notify:
        - Check SSH Syntax
        - Restart SSH Service

    - name: 4. Security - Verify Public Key
      ansible.posix.authorized_key:
        user: "{{ deploy_user }}"
        state: present
        key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"
        exclusive: yes

    - name: 5. Folders - Prepare App Directories
      ansible.builtin.file:
        path: "/home/{{ deploy_user }}/app"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: '0755'

    - name: 6. Security - Firewall (UFW)
      block:
        - name: Allow Required Ports (SSH & Web)
          community.general.ufw:
            rule: allow
            port: "{{ item }}"
            proto: tcp
          loop: [ '80', '443', '65500']

        - name: Delete Port 22 Rule
          community.general.ufw:
            rule: allow
            port: '22'
            delete: true

        - name: Finalize - Default Deny and Enable
          community.general.ufw:
            state: enabled
            policy: deny
            direction: incoming

    - name: 7. Infrastructure - Install and Configure Docker
      block:
        - name: Install prerequisite packages
          ansible.builtin.apt:
            name:
              - apt-transport-https
              - ca-certificates
              - curl
              - gnupg
              - lsb-release
            state: present
            update_cache: yes
          register: apt_status
          until: apt_status is success
          retries: 10
          delay: 12

        - name: Add Docker GPG apt Key
          ansible.builtin.apt_key:
            url: https://download.docker.com/linux/ubuntu/gpg
            state: present

        - name: Add Docker Repository
          ansible.builtin.apt_repository:
            repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
            state: present

        - name: Install Docker Engine
          ansible.builtin.apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-buildx-plugin
              - docker-compose-plugin
            state: present
            update_cache: yes
          register: apt_status
          until: apt_status is success
          retries: 10
          delay: 12

        - name: Ensure Docker service is started and enabled
          ansible.builtin.service:
            name: docker
            state: started
            enabled: yes

        - name: Add deploy user to docker group
          ansible.builtin.user:
            name: "{{ deploy_user }}"
            groups: docker
            append: yes
          notify: Restart Docker

    - name: 8. Security - Install and Configure Fail2Ban
      block:
        - name: Install Fail2Ban package
          ansible.builtin.apt:
            name: fail2ban
            state: present
            update_cache: yes
          register: apt_status
          until: apt_status is success
          retries: 10
          delay: 12

        - name: Create local jail configuration
          ansible.builtin.copy:
            dest: /etc/fail2ban/jail.local
            content: |
              [DEFAULT]
              bantime  = 3600
              findtime = 600
              maxretry = 3

              [sshd]
              enabled = true
              port    = 65500
              logpath = /var/log/auth.log
              backend = systemd
          notify: Restart Fail2Ban

        - name: Ensure Fail2Ban is running and enabled
          ansible.builtin.service:
            name: fail2ban
            state: started
            enabled: yes

    - name: 9. Maintenance - System Hygiene & Log Management
      block:
        - name: Configure custom App/Nginx rotation
          ansible.builtin.copy:
            dest: /etc/logrotate.d/portfolio-app
            content: |
              /home/{{ deploy_user }}/app/*.log /var/log/nginx/*.log {
                  weekly
                  size 50M
                  rotate 4
                  missingok
                  notifempty
                  compress
                  delaycompress
                  sharedscripts
                  postrotate
                      [ -f /var/run/nginx.pid ] && kill -USR1 `cat /var/run/nginx.pid`
                  endscript
              }

        - name: Configure Global Docker Log Rotation
          ansible.builtin.copy:
            dest: /etc/docker/daemon.json
            content: |
              {
                "log-driver": "json-file",
                "log-opts": {
                  "max-size": "30m",
                  "max-file": "3"
                }
              }
          notify: Restart Docker

        - name: Cap Systemd Journal at 100MB
          ansible.builtin.lineinfile:
            path: /etc/systemd/journald.conf
            regexp: '^#?SystemMaxUse='
            line: 'SystemMaxUse=100M'
          notify: Restart Journald

    - name: 10. Maintenance - Automated Security & Self-Cleaning
      block:
        - name: Install unattended-upgrades
          ansible.builtin.apt:
            name: [unattended-upgrades, update-notifier-common]
            state: present
          register: apt_status
          until: apt_status is success
          retries: 10
          delay: 12

        - name: Configure intervals
          ansible.builtin.copy:
            dest: /etc/apt/apt.conf.d/20auto-upgrades
            content: |
              APT::Periodic::Update-Package-Lists "1";
              APT::Periodic::Unattended-Upgrade "1";
              APT::Periodic::AutocleanInterval "7";

        - name: Configure Auto-Reboot and Deep Cleaning
          ansible.builtin.copy:
            dest: /etc/apt/apt.conf.d/50unattended-upgrades
            content: |
              Unattended-Upgrade::Allowed-Origins {
                  "${distro_id}:${distro_codename}-security";
                  "${distro_id}ESMApps:${distro_codename}-apps-security";
                  "${distro_id}ESM:${distro_codename}-infra-security";
              };
              
              Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
              Unattended-Upgrade::Remove-New-Unused-Dependencies "true";
              Unattended-Upgrade::Remove-Unused-Dependencies "true";
              
              Unattended-Upgrade::Automatic-Reboot "true";
              Unattended-Upgrade::Automatic-Reboot-Time "04:00";

  handlers:
    - name: Check SSH Syntax
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false

    - name: Restart SSH Service
      ansible.builtin.service:
        name: ssh
        state: restarted

    - name: Restart Fail2Ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted

    - name: Restart Docker
      ansible.builtin.service:
        name: docker
        state: restarted

    - name: Restart Journald
      ansible.builtin.service:
        name: systemd-journald
        state: restarted
